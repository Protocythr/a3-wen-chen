<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel='stylesheet' href='simple.css' />
</head>
<body>

<h1>Expense Tracker</h1>

<form action="/api/submit-expense" id="expenseForm" method="POST">

    <!-- Expense Date -->
    <label for="date">Date:</label>
    <input type="date" id="date" name="date" required>
    <br><br>

    <!-- Expense Name -->
    <label for="expense">Expense:</label>
    <input
            type="text"
            id="expense"
            name="expense"
            placeholder="e.g. Groceries"
            required
    >
    <br><br>

    <!-- Amount -->
    <label for="amount">Amount ($):</label>
    <input
            type="number"
            id="amount"
            name="amount"
            placeholder="0.00"
            step="0.01"
            min="0"
            required
    >
    <br><br>

    <!-- Category -->
    <label for="category">Category:</label>
    <select id="category" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="food">Food</option>
        <option value="transportation">Transportation</option>
        <option value="shopping">Shopping</option>
        <option value="bills">Bills</option>
        <option value="entertainment">Entertainment</option>
        <option value="other">Other</option>
    </select>
    <br><br>

    <!-- Description -->
    <label for="description">Description:</label>
    <br>
    <textarea
            id="description"
            name="description"
            rows="4"
            cols="40"
            placeholder="Add a description..."
    ></textarea>
    <br><br>

    <!-- Submit Button -->
    <button type="submit" id="expenseSubmitButton">Add Expense</button>

</form>

<script>
    const form = document.getElementById('expenseForm');

    form.addEventListener('submit', async function(event) {
        console.log("start");
        event.preventDefault();

        const json = {
            expenseDate: document.getElementById('date').value,
            expenseName: document.getElementById('expense').value,
            expenseAmount: document.getElementById('amount').value,
            expenseCategory: document.getElementById('category').value,
            expenseDescription: document.getElementById('description').value
        };

        console.log(json);

        const response = await fetch('/api/submit-expense', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(json)
        });

        const result = await response.json();
        console.log(result);
    });
</script>

</body>
</html>
